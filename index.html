<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Air Guard - Global Dashboard</title>
  <script src="//unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background: #040d21; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    
    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      color: white;
      pointer-events: none;
    }

    .glass-panel {
      background: rgba(13, 25, 48, 0.7);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }

    /* Custom Tooltip Styling */
    .scene-tooltip {
      color: white !important;
      background: rgba(0, 0, 0, 0.9) !important;
      padding: 12px !important;
      border-radius: 8px !important;
      border: 1px solid #444 !important;
      font-size: 14px;
      line-height: 1.4;
    }

    .aqi-val { font-weight: bold; font-size: 18px; }

    #legend {
      position: absolute;
      bottom: 40px;
      right: 20px;
      z-index: 100;
      color: white;
      font-size: 12px;
    }

    .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div class="glass-panel">
      <h1 style="margin:0; letter-spacing: 2px; color: #00f2ff;">AI AIR GUARD</h1>
      <p style="opacity: 0.8;">Live Global Air Quality Monitoring</p>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
      <div id="status">Syncing with global sensors...</div>
    </div>
  </div>

  <div id="legend" class="glass-panel">
    <div class="legend-item"><div class="dot" style="background: #00ff00;"></div> Good (0-50)</div>
    <div class="legend-item"><div class="dot" style="background: #ffff00;"></div> Moderate (51-100)</div>
    <div class="legend-item"><div class="dot" style="background: #ff7e00;"></div> Sensitive (101-150)</div>
    <div class="legend-item"><div class="dot" style="background: #ff0000;"></div> Unhealthy (151-200)</div>
    <div class="legend-item"><div class="dot" style="background: #8f3f97;"></div> Hazardous (201+)</div>
  </div>

  <div id="globeViz"></div>

  <script>
    // 1. Color Logic: Traffic Light System
    const getAQIColor = aqi => {
      if (aqi <= 50) return '#00ff00';  // Green
      if (aqi <= 100) return '#ffff00'; // Yellow
      if (aqi <= 150) return '#ff7e00'; // Orange
      if (aqi <= 200) return '#ff0000'; // Red
      return '#8f3f97';                 // Purple/Hazardous
    };

    // 2. Initialize the Globe
    const globe = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointRadius(0.6)
      .pointAltitude(0.02)
      .pointColor(d => getAQIColor(d.aqi))
      .pointLabel(d => `
        <div class="scene-tooltip">
          <b style="font-size: 16px; color: #00f2ff;">${d.name}</b><br/>
          AQI: <span class="aqi-val" style="color: ${getAQIColor(d.aqi)}">${d.aqi}</span><br/>
          Status: ${d.aqi <= 50 ? 'Healthy' : d.aqi <= 100 ? 'Moderate' : 'Alert'}
        </div>
      `);

    // 3. Rotation Settings
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.5;

    // 4. Dummy Data (Replace with API call below)
    const sampleData = [
      { name: "New York, USA", lat: 40.71, lng: -74.00, aqi: 42 },
      { name: "New Delhi, India", lat: 28.61, lng: 77.20, aqi: 310 },
      { name: "London, UK", lat: 51.50, lng: -0.12, aqi: 55 },
      { name: "Beijing, China", lat: 39.90, lng: 116.40, aqi: 180 },
      { name: "Sydney, Australia", lat: -33.86, lng: 151.20, aqi: 25 },
      { name: "Lagos, Nigeria", lat: 6.52, lng: 3.37, aqi: 115 }
    ];

    globe.pointsData(sampleData);

    // 5. LIVE DATA SYNC (Optional: Requires a WAQI Token)
    /*
    async function fetchLiveData() {
      const TOKEN = 'YOUR_WAQI_API_TOKEN';
      const response = await fetch(`https://api.waqi.info/v2/map/bounds?latlng=-90,-180,90,180&token=${TOKEN}`);
      const result = await response.json();
      if (result.status === 'ok') {
        const livePoints = result.data.map(station => ({
          name: station.station.name,
          lat: station.lat,
          lng: station.lon,
          aqi: parseInt(station.aqi)
        }));
        globe.pointsData(livePoints);
        document.getElementById('status').innerText = `Syncing ${livePoints.length} active stations...`;
      }
    }
    fetchLiveData();
    */
  </script>
</body>
</html>
